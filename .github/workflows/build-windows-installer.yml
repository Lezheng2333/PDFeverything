name: Build Windows Installer

# 在 windows-latest 上跑与本地 build_windows.py 完全相同的流水线：
# 源代码冒烟 → 核心测试套件 → PyInstaller onefile → Inno Setup 安装包 → 上传产物。
#
#   gh workflow run build-windows-installer.yml
#   gh run watch
#   gh run download <run-id> -n PDFeverything-Setup -D /tmp/win

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读取 main.py 的 VERSION）"
        required: false
        default: ""
      run_tests:
        description: "构建前跑核心测试套件（tests/test_core.py）"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # build_windows.py 末尾有 input() 暂停，CI 里必须跳过
  PDFEVERYTHING_NO_PAUSE: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            Write-Host "choco did not provide ISCC, trying winget"
            winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup ISCC.exe not found" }
          & $iscc /? | Select-Object -First 1
          Write-Host "ISCC ready: $iscc"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = (Select-String -Path main.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          if ([string]::IsNullOrWhiteSpace($v)) { throw "Could not resolve version from main.py" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building PDFeverything v$v"

      - name: Smoke test source tree
        run: python main.py -h

      - name: Core test suite
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: python tests/test_core.py

      - name: Build exe and installer
        run: python build_windows.py --skip-deps

      - name: Smoke test packaged exe
        shell: pwsh
        run: |
          $exe = "dist\PDFeverything.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          Write-Host "payload: $([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB"

          function Invoke-Pdfe([string]$path, [string[]]$exeArgs, [string]$label) {
            Write-Host "--- $label ---"
            # console=False 的 GUI 子系统程序，PowerShell 不会自动等待，必须显式 WaitForExit
            $p = Start-Process -FilePath $path -ArgumentList $exeArgs -NoNewWindow -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "$label did not exit within 180s" }
            if ($p.ExitCode -ne 0) { throw "$label exited with code $($p.ExitCode)" }
            Write-Host "$label ok"
          }

          # 1) 帮助文本：v1.9.0 的 exe 在这里抛过 UnicodeEncodeError —— 英文代码页的
          #    stdout 印不出中文帮助，windowed 模式把异常变成弹窗，进程就此卡死。
          Invoke-Pdfe $exe @("-h") "help"

          # 2) 真跑一次 PDF 操作，确认冻结后的二进制不只是"能启动"（hiddenimports 漏了
          #    的话只有到这里才会暴露）
          python -c "import fitz; d = fitz.open(); d.new_page(); d.save('ci_fixture.pdf')"
          Invoke-Pdfe $exe @("info", "-i", "ci_fixture.pdf") "pdf info"

      - name: Verify installer
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -Path . -Filter "PDFeverything_Setup_v*.exe")
          if ($setups.Count -eq 0) { throw "installer was not produced" }
          foreach ($s in $setups) {
            Write-Host "$($s.Name) - $([math]::Round($s.Length / 1MB, 1)) MB"
          }
          $expected = "PDFeverything_Setup_v${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $expected)) { throw "expected installer $expected not found" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDFeverything-Setup
          path: PDFeverything_Setup_v*.exe
          if-no-files-found: error
          retention-days: 30
